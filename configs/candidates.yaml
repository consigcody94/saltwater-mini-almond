schema_version: "1.3"
thresholds:
  h1_claim_log_ratio: 0.1823215567939546
  h1_power_log_ratio: 0.26236426446749106
  h1_min_probability: 0.90
  h2_control_ratio_min: 0.90
  h2_max_bad_probability: 0.10
  h3_min_probability: 0.90
  finalist_cap: 4
  tie_interval: 0.02
  probability_mcse_max: 0.005
candidates:
  - candidate_id: C1
    construct_name: PyKPA1
    donor_species: "Pyropia yezoensis (Neopyropia yezoensis)"
    sequence_accessions: [AJ972674]
    sequence_status: verified
    evidence_tier: E2
    evidence_label: hypothesis_prior
    primary_parameter_id: na_efflux_vmax_multiplier
    h3_rule:
      endpoint: root_surface_outward_na_flux_per_root_dry_mass
      unit: "umol Na g_root_dry_mass^-1 h^-1"
      scale: log_ratio
      direction: ge
      margin: 0.1823215567939546
    gates:
      sequence_build: required
      directional_assay: required
    risk_warning: "ATP burden, disturbed K homeostasis, or sodium returned to recirculating water remain disqualifying risks."
  - candidate_id: C2
    construct_name: PyAPX
    donor_species: "Pyropia yezoensis"
    sequence_accessions: []
    sequence_status: pending_audit
    evidence_tier: E2
    evidence_label: hypothesis_prior
    primary_parameter_id: ros_clearance_multiplier
    h3_rule:
      endpoint: root_h2o2_concentration_time_auc
      unit: "umol H2O2 g_root_fresh_mass^-1 h"
      scale: log_ratio
      direction: le
      margin: -0.2231435513142097
    gates:
      sequence_build: blocked
      directional_assay: required
    risk_warning: "Exact public nucleotide accession is pending sequence audit; ROS improvement alone cannot establish salt exclusion, biomass benefit, or safe ion fate."
  - candidate_id: C3
    construct_name: "EsM1PDH1+EsM1Pase2"
    donor_species: "Ectocarpus sp. Ec32"
    sequence_accessions: [Esi0017_0062, Esi0100_0020]
    sequence_status: verified
    evidence_tier: E2
    evidence_label: hypothesis_prior
    primary_parameter_id: mannitol_vmax_multiplier
    h3_rule:
      endpoint: root_mannitol_concentration_above_empty_vector
      unit: "nmol g_root_fresh_mass^-1"
      scale: difference
      direction: ge
      margin: 10.0
    gates:
      sequence_build: required
      directional_assay: required
    risk_warning: "Carbon diversion, mannitol-1-phosphate accumulation, or insufficient mannitol for osmotic benefit remain disqualifying risks."
  - candidate_id: C4
    construct_name: SbSOS1
    donor_species: "Salicornia brachiata Roxb."
    sequence_accessions: [EU879059]
    sequence_status: verified
    evidence_tier: E2
    evidence_label: hypothesis_prior
    primary_parameter_id: na_efflux_vmax_multiplier
    h3_rule:
      endpoint: root_surface_outward_na_flux_per_root_dry_mass
      unit: "umol Na g_root_dry_mass^-1 h^-1"
      scale: log_ratio
      direction: ge
      margin: 0.1823215567939546
    gates:
      sequence_build: required
      cortex_localization: required
      directional_assay: required
    risk_warning: "The source tobacco study reported elevated stem and xylem-sap Na; C4 is a conditional risk-bearing candidate requiring cortex-facing rather than xylem-facing expression."
  - candidate_id: C5
    construct_name: PpHKT1
    donor_species: "Prunus persica 'Nemaguard'"
    sequence_accessions: [Prupe.1G067100]
    sequence_status: verified
    evidence_tier: E1
    evidence_label: hypothesis_prior
    primary_parameter_id: xylem_na_retrieval_multiplier
    h3_rule:
      endpoint: xylem_sap_na_concentration_time_auc
      unit: "mmol Na L^-1 h"
      scale: log_ratio
      direction: le
      margin: -0.2231435513142097
    gates:
      sequence_build: required
      directional_assay: required
    risk_warning: "Excess root-stele sodium retention or K disruption remain disqualifying risks."
  - candidate_id: C6
    construct_name: PpSOS2_PpCIPK24
    donor_species: "Prunus persica 'Nemaguard'"
    sequence_accessions: [Prupe.7G244500.1, XP_020424233.1]
    sequence_status: verified
    evidence_tier: E1
    evidence_label: hypothesis_prior
    primary_parameter_id: sos_efflux_activation_multiplier
    h3_rule:
      endpoint: root_surface_outward_na_flux_per_root_dry_mass
      unit: "umol Na g_root_dry_mass^-1 h^-1"
      scale: log_ratio
      direction: ge
      margin: 0.1823215567939546
    gates:
      sequence_build: required
      directional_assay: required
    risk_warning: "Pleiotropy through other CIPK targets or failure without compatible CBL/SOS1 activation remain disqualifying risks."
