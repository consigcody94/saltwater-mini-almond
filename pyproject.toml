[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "saltwater-mini-almond"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1", "scipy>=1.14", "pandas>=2.2", "pyarrow>=17",
  "xarray>=2024.7", "pydantic>=2.8", "pint>=0.24", "PyYAML>=6.0",
  "typer>=0.12", "pymc>=5.16", "arviz>=0.19", "matplotlib>=3.9",
  "jinja2>=3.1", "statsmodels>=0.14", "python-docx>=1.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.112"]

[project.scripts]
almondlab = "almondlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/almondlab"]

[tool.hatch.build]
include = [
  "src/almondlab/**/*.py",
  "src/almondlab/resources/**/*.json",
  "src/almondlab/resources/**/*.yaml",
  "src/almondlab/resources/**/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
