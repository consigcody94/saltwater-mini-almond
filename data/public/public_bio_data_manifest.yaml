critical_gaps:
  - id: "GAP_NO_SEAWATER_ALMOND_DATA"
    severity: "critical"
    statement: "No verified public almond dataset demonstrates survival, growth, or nut yield under undiluted seawater. Existing studies use EC 3 dS/m irrigation, mixed salts, or up to 150 mM NaCl."
  - id: "GAP_PYAPX_SEQUENCE"
    severity: "critical"
    statement: "The exact PyAPX sequence/accession used in the recent rice paper was not verified; it is not construct-ready."
  - id: "GAP_HKT1_CLONE"
    severity: "critical"
    statement: "The functional paper's Nemaguard PpHKT1 clone/promoter has no verified accession; two Lovell RefSeq isoforms exist."
  - id: "GAP_SOS2_NOMENCLATURE"
    severity: "high"
    statement: "Prupe.7G244500 is called PprCIPK17 and PpCIPK24/PpSOS2 in different primary studies; sequence accession.version must anchor identity."
  - id: "GAP_PRJNA732909_SAMPLE_KEY"
    severity: "critical"
    statement: "The 24 PRJNA732909 runs lack per-run treatment labels in verified ENA metadata; a publisher/author sample-to-condition key is needed before differential expression."
  - id: "GAP_HAIRY_ROOT_ZENODO"
    severity: "critical"
    statement: "Zenodo DOI 10.5281/zenodo.10945763 cited for almond editing sequences/chromatograms returns HTTP 410 Gone."
  - id: "GAP_ECTOCARPUS_GENE_CROSSWALK"
    severity: "high"
    statement: "Legacy Esi mannitol-pathway identifiers need sequence-level crosswalk; Esi0020_0181 and Esi0100_0020 must not be conflated."
  - id: "GAP_RAW_PHENOTYPES"
    severity: "high"
    statement: "Key almond/rootstock salinity studies expose tables/supplements but no independently deposited machine-readable raw phenotype or instrument files."
  - id: "GAP_PERENNIAL_OUTCOMES"
    severity: "critical"
    statement: "No verified dataset links candidate constructs to multi-year almond survival, flowering, yield, kernel quality, rootstock/scion compatibility, or food-safety outcomes."

